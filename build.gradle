plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.11'

// mods.toml declares version="${file.jarVersion}", which FML reads from the jar
// manifest. Without this the mod loads as "0.0NONE".
jar {
    manifest {
        attributes([
            'Implementation-Version': project.version
        ])
    }
}
group = 'de.sarocesch'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'fakename'
        }
        register('client')
        register('server') { args '--nogui' }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', 'fakename', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.2')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// Forge 26.3 ships Mixin 0.8.7 (max class version 65): restamp mixin classes so they get applied
tasks.named('compileJava') {
    doLast { task ->
        task.destinationDirectory.get().asFile.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.class') || !f.path.replace(File.separator, '/').contains('/mixins/')) return
            byte[] b = f.bytes
            if (b.length > 7 && ((b[7] & 0xFF) > 65)) { b[6] = 0; b[7] = (byte) 65; f.bytes = b }
        }
    }
}
